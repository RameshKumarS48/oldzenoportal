name = "dome"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

routes = [
  { pattern = "dome.rameshkumar.space", custom_domain = true }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Staging: a separate worker on workers.dev, never the custom domain.
# Deploy with `pnpm cf:deploy:staging`.
[env.staging]
name = "dome-staging"
routes = []
workers_dev = true

[env.staging.assets]
directory = ".open-next/assets"
binding = "ASSETS"
